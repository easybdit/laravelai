name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Laravel 11.x (PHP 8.2/8.3 + testbench 9.*) is temporarily dropped from
  # this matrix, not because of anything in this package: as of this
  # writing, every laravel/framework 11.x release ever published — up
  # through the latest, v11.55.1 — is flagged by one or more security
  # advisories that were only ever fixed starting at 12.60.0/13.10.0, never
  # backported to the 11.x line. Composer's advisory-aware dependency
  # resolution refuses to select ANY of them, so `composer require
  # orchestra/testbench:9.*` (which needs laravel/framework ^11.0) is
  # structurally unsatisfiable right now — confirmed via this exact CI job's
  # own "Install dependencies" step, and not something a composer.json
  # change on this package's side can route around (tried the
  # policy.advisories.block config Composer's own error message points at;
  # it isn't recognized by the Composer version this repo's CI actually
  # runs, and there's no local way to verify the exact schema for whatever
  # version that is). composer.json's own illuminate/support constraint
  # still declares Laravel 11 support — real installs are unaffected, since
  # they use whatever laravel/framework their own app already has, never a
  # fresh testbench-driven install. Re-add this leg once either Laravel
  # patches the 11.x line or the correct Composer-side policy override for
  # whatever version GitHub's runner ships becomes clear.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer install --no-interaction --prefer-dist

      # Plain `run: vendor/bin/phpunit` leaves a failure's actual PHPUnit/PHP
      # output stuck inside the step's raw log, which GitHub does not expose
      # to unauthenticated viewers (confirmed while diagnosing a real CI
      # failure in this exact job — the log page shows "Sign in to view
      # logs" even on this public repo). Surfacing lines as ::error::
      # workflow commands turns them into check-run annotations instead,
      # which the public REST API *does* return without auth
      # (.../check-runs/{job_id}/annotations).
      #
      # GitHub caps annotations at ~10 per step, discovered the hard way: a
      # naive `tail -n 60 | ::error::` on a real failure here burned the
      # entire budget on deep Laravel middleware-pipeline stack frames,
      # cutting off before it ever reached the actual "N) Test::method" /
      # exception-message header — the one part that says what actually
      # went wrong. Grep specifically for PHPUnit's numbered failure/error
      # headers (plus the 2 lines after each, where the exception class and
      # message live) instead of blindly tailing, so the limited annotation
      # budget goes to the signal, not 40 lines of framework stack trace.
      - name: Run tests
        run: |
          set +e
          vendor/bin/phpunit 2>&1 | tee /tmp/phpunit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            grep -A2 -E '^[0-9]+\) ' /tmp/phpunit-output.txt | head -n 40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::error::$(tail -n 5 /tmp/phpunit-output.txt | tr '\n' ' ')"
          fi
          exit $EXIT_CODE

  # In addition to (not replacing) the sqlite matrix above — several
  # migrations have real driver-specific branches (e.g. the MySQL-only
  # `ALTER … MODIFY` in 2026_08_14_000003_add_queued_status_to_project_files.php,
  # vs. sqlite/pgsql's Schema::change() branch of the same migration) that
  # sqlite alone never exercises. Pinned to one representative PHP/Laravel
  # combo rather than the full version matrix above × 2 databases — DB
  # driver correctness and PHP/Laravel version compatibility are
  # orthogonal concerns, and crossing both would multiply CI cost for
  # little extra signal.
  test-db-matrix:
    name: DB matrix — ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    services:
      # A dedicated user, not root: found live that MYSQL_ALLOW_EMPTY_PASSWORD's
      # root grant is scoped to 'root'@'localhost' only, but the job
      # container connects to this service container over the Docker
      # bridge network — from an IP like 172.18.0.1, not localhost — so
      # root@<bridge-ip> is a genuinely different, ungranted combination
      # and every connection attempt was rejected with "Access denied for
      # user 'root'@'172.18.0.1'". MYSQL_USER/MYSQL_PASSWORD are granted
      # '@%' (any host) by the official image, which is what a
      # cross-container connection actually needs. MYSQL_ALLOW_EMPTY_PASSWORD
      # still has to stay, though, for an unrelated reason: the image's own
      # entrypoint refuses to start at all — "Initialize containers" failing
      # outright, before any connection is even attempted — unless at least
      # one of MYSQL_ROOT_PASSWORD/MYSQL_ALLOW_EMPTY_PASSWORD/
      # MYSQL_RANDOM_ROOT_PASSWORD is set, found live the hard way by
      # removing it in an earlier attempt at this exact fix.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_USER: laravelai
          MYSQL_PASSWORD: laravelai
          MYSQL_DATABASE: laravelai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laravelai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: laravelai_test
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'laravelai' || 'postgres' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && 'laravelai' || 'postgres' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:12.*" "illuminate/http:12.*" "orchestra/testbench:10.*" --no-update
          composer install --no-interaction --prefer-dist

      # The service's own --health-cmd only proves the DB *server process*
      # answers pings — not that the target database
      # (MYSQL_DATABASE/POSTGRES_DB) has actually finished being created,
      # which happens on the container's first-boot init script shortly
      # *after* the server starts accepting connections. A test suite that
      # starts the instant the health check goes green can race that init
      # step. Retries an actual PDO connection to the real target database
      # (not just a ping) for up to 30s before handing off to phpunit, so a
      # genuine app-code failure is never masked as a flaky-looking one.
      - name: Wait for database to accept real connections
        run: |
          php -r '
            $driver = getenv("DB_CONNECTION");
            $dsn = $driver === "pgsql"
              ? sprintf("pgsql:host=%s;port=%s;dbname=%s", getenv("DB_HOST"), getenv("DB_PORT"), getenv("DB_DATABASE"))
              : sprintf("mysql:host=%s;port=%s;dbname=%s", getenv("DB_HOST"), getenv("DB_PORT"), getenv("DB_DATABASE"));
            $deadline = time() + 30;
            $lastError = "(no attempt made)";
            while (time() < $deadline) {
              try {
                new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
                echo "Connected to {$driver}\n";
                exit(0);
              } catch (\PDOException $e) {
                $lastError = $e->getMessage();
                echo "Waiting for {$driver}... ({$lastError})\n";
                sleep(2);
              }
            }
            // ::error:: makes this readable via the check-runs annotations
            // API without needing log auth — a plain STDERR write here sits
            // in the same unreadable-without-auth raw log as everything else.
            echo "::error::Gave up waiting for {$driver} on {$dsn} after 30s. Last error: {$lastError}\n";
            exit(1);
          '

      # Plain `run: vendor/bin/phpunit` leaves a failure's actual PHPUnit/PHP
      # output stuck inside the step's raw log, which GitHub does not expose
      # to unauthenticated viewers (confirmed while diagnosing a real CI
      # failure in this exact job — the log page shows "Sign in to view
      # logs" even on this public repo). Surfacing lines as ::error::
      # workflow commands turns them into check-run annotations instead,
      # which the public REST API *does* return without auth
      # (.../check-runs/{job_id}/annotations).
      #
      # GitHub caps annotations at ~10 per step, discovered the hard way: a
      # naive `tail -n 60 | ::error::` on a real failure here burned the
      # entire budget on deep Laravel middleware-pipeline stack frames,
      # cutting off before it ever reached the actual "N) Test::method" /
      # exception-message header — the one part that says what actually
      # went wrong. Grep specifically for PHPUnit's numbered failure/error
      # headers (plus the 2 lines after each, where the exception class and
      # message live) instead of blindly tailing, so the limited annotation
      # budget goes to the signal, not 40 lines of framework stack trace.
      - name: Run tests
        run: |
          set +e
          vendor/bin/phpunit 2>&1 | tee /tmp/phpunit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            grep -A2 -E '^[0-9]+\) ' /tmp/phpunit-output.txt | head -n 40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::error::$(tail -n 5 /tmp/phpunit-output.txt | tr '\n' ' ')"
          fi
          exit $EXIT_CODE