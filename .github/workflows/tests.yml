name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer install --no-interaction --prefer-dist

      # Plain `run: vendor/bin/phpunit` leaves a failure's actual PHPUnit/PHP
      # output stuck inside the step's raw log, which GitHub does not expose
      # to unauthenticated viewers (confirmed while diagnosing a real CI
      # failure in this exact job — the log page shows "Sign in to view
      # logs" even on this public repo). Surfacing the tail of the output as
      # ::error:: workflow commands turns it into a check-run annotation
      # instead, which the public REST API does return without auth
      # (.../check-runs/{job_id}/annotations) — the only way anyone without
      # write access to this repo can actually read why a run failed.
      - name: Run tests
        run: |
          set +e
          vendor/bin/phpunit 2>&1 | tee /tmp/phpunit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            tail -n 60 /tmp/phpunit-output.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $EXIT_CODE

  # In addition to (not replacing) the sqlite matrix above — several
  # migrations have real driver-specific branches (e.g. the MySQL-only
  # `ALTER … MODIFY` in 2026_08_14_000003_add_queued_status_to_project_files.php,
  # vs. sqlite/pgsql's Schema::change() branch of the same migration) that
  # sqlite alone never exercises. Pinned to one representative PHP/Laravel
  # combo rather than the full version matrix above × 2 databases — DB
  # driver correctness and PHP/Laravel version compatibility are
  # orthogonal concerns, and crossing both would multiply CI cost for
  # little extra signal.
  test-db-matrix:
    name: DB matrix — ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laravelai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laravelai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: laravelai_test
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && '' || 'postgres' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:12.*" "illuminate/http:12.*" "orchestra/testbench:10.*" --no-update
          composer install --no-interaction --prefer-dist

      # The service's own --health-cmd only proves the DB *server process*
      # answers pings — not that the target database
      # (MYSQL_DATABASE/POSTGRES_DB) has actually finished being created,
      # which happens on the container's first-boot init script shortly
      # *after* the server starts accepting connections. A test suite that
      # starts the instant the health check goes green can race that init
      # step. Retries an actual PDO connection to the real target database
      # (not just a ping) for up to 30s before handing off to phpunit, so a
      # genuine app-code failure is never masked as a flaky-looking one.
      - name: Wait for database to accept real connections
        run: |
          php -r '
            $driver = getenv("DB_CONNECTION");
            $dsn = $driver === "pgsql"
              ? sprintf("pgsql:host=%s;port=%s;dbname=%s", getenv("DB_HOST"), getenv("DB_PORT"), getenv("DB_DATABASE"))
              : sprintf("mysql:host=%s;port=%s;dbname=%s", getenv("DB_HOST"), getenv("DB_PORT"), getenv("DB_DATABASE"));
            $deadline = time() + 30;
            while (time() < $deadline) {
              try {
                new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
                echo "Connected to {$driver}\n";
                exit(0);
              } catch (\PDOException $e) {
                echo "Waiting for {$driver}... ({$e->getMessage()})\n";
                sleep(2);
              }
            }
            fwrite(STDERR, "Gave up waiting for {$driver} after 30s\n");
            exit(1);
          '

      # Plain `run: vendor/bin/phpunit` leaves a failure's actual PHPUnit/PHP
      # output stuck inside the step's raw log, which GitHub does not expose
      # to unauthenticated viewers (confirmed while diagnosing a real CI
      # failure in this exact job — the log page shows "Sign in to view
      # logs" even on this public repo). Surfacing the tail of the output as
      # ::error:: workflow commands turns it into a check-run annotation
      # instead, which the public REST API does return without auth
      # (.../check-runs/{job_id}/annotations) — the only way anyone without
      # write access to this repo can actually read why a run failed.
      - name: Run tests
        run: |
          set +e
          vendor/bin/phpunit 2>&1 | tee /tmp/phpunit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            tail -n 60 /tmp/phpunit-output.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $EXIT_CODE